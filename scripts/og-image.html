<!doctype html>
<!--
  Source for public/og-image.png, the link-preview image: the home page's
  hero (banner, face, name and title). To regenerate after changing any of
  those, open this file in a browser at a 1200×630 viewport and save a
  screenshot over public/og-image.png — e.g. in Chrome DevTools, device
  toolbar at 1200×630 and DPR 2, then "Capture screenshot". That gives a
  2400×1260 image, the size index.html's og:image tags declare.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Inter;
				src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2');
				font-weight: 100 900;
			}
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				background: oklch(0.992 0.008 85);
				font-family: Inter, sans-serif;
				position: relative;
			}
			.banner {
				height: 300px;
				background: url('../src/assets/background-image.svg') center 35% / cover
					no-repeat;
			}
			.face {
				position: absolute;
				top: 190px;
				left: 50%;
				transform: translateX(-50%);
				width: 200px;
				height: 200px;
				border-radius: 50%;
				background: oklch(0.992 0.008 85);
				box-shadow:
					0 0 0 8px oklch(0.992 0.008 85),
					0 10px 25px rgb(0 0 0 / 0.15);
				display: grid;
				place-items: center;
			}
			.face img {
				width: 200px;
				height: 200px;
			}
			.text {
				position: absolute;
				top: 412px;
				width: 100%;
				text-align: center;
			}
			h1 {
				margin: 0;
				font-size: 68px;
				font-weight: 700;
				letter-spacing: -0.025em;
				color: oklch(0.2 0.01 85);
			}
			p {
				margin: 10px 0 0;
				font-size: 38px;
				color: oklch(0.5 0.01 85);
			}
		</style>
	</head>
	<body>
		<div class="banner"></div>
		<div class="face"><img src="../src/assets/face.svg" /></div>
		<div class="text">
			<h1>Abilaesh Kandiah</h1>
			<p>Senior Software Engineer</p>
		</div>
	</body>
</html>
